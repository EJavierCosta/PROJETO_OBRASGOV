name: obrasgov
version: 1.0.0
config-version: 2

profile: obrasgov

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

on-run-end:
  - "{{ grant_chat_snapshot_metadata() }}"

models:
  obrasgov:
    staging:
      +materialized: table
      +schema: silver
    intermediate:
      +materialized: table
      +schema: silver
    marts:
      +materialized: table
      +schema: gold
      +contract:
        enforced: true
