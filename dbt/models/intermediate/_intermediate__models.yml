version: 2

models:
  - name: int_obrasgov_current_ingestion
    description: Última execução concluída com sucesso, usada exclusivamente pelas views current.
    columns:
      - name: ingestion_id
        tests:
          - not_null
          - unique

  - name: int_obrasgov_project_investment
    description: Explosão tipada de investimentos previstos, sem agregação entre fontes.
    columns:
      - name: investment_item_key
        tests:
          - not_null
          - unique
      - name: project_snapshot_key
        tests:
          - not_null
          - relationships:
              to: ref('stg_obrasgov_project')
              field: project_snapshot_key

  - name: int_obrasgov_project_axis_type
    description: Explosão tipada de cada combinação de eixo, tipo e subtipo.
    columns:
      - name: project_axis_type_key
        tests:
          - not_null
          - unique
      - name: project_snapshot_key
        tests:
          - not_null
          - relationships:
              to: ref('stg_obrasgov_project')
              field: project_snapshot_key

  - name: int_obrasgov_project_pin
    description: Explosão tipada dos pins de localização associados ao projeto.
    columns:
      - name: pin_key
        tests:
          - not_null
          - unique
      - name: project_snapshot_key
        tests:
          - not_null
          - relationships:
              to: ref('stg_obrasgov_project')
              field: project_snapshot_key
