version: 2

models:
  - name: fct_project_snapshot
    description: Snapshot histórico de cada projeto do recorte Gold, uma linha por projeto e ingestão.
    columns:
      - name: project_snapshot_key
        data_type: text
        tests: [not_null, unique]
      - name: ingestion_id
        data_type: uuid
        tests:
          - not_null
          - relationships:
              to: ref('stg_obrasgov_ingestion_run')
              field: ingestion_id
      - name: project_id
        data_type: text
        tests: [not_null]
      - name: organization_key
        data_type: text
        tests:
          - not_null
          - relationships:
              to: ref('dim_organization')
              field: organization_key
      - name: intervention_key
        data_type: text
        tests:
          - not_null
          - relationships:
              to: ref('dim_intervention')
              field: intervention_key
      - name: project_name
        data_type: text
      - name: project_description
        data_type: text
      - name: source_status
        data_type: text
      - name: uf_principal
        data_type: text
      - name: nature_intervention
        data_type: text
      - name: species_intervention
        data_type: text
      - name: nature_intervention_id
        data_type: integer
      - name: species_intervention_id
        data_type: integer
      - name: organization_name
        data_type: text
      - name: organization_cnpj
        data_type: text
      - name: registration_date
        data_type: date
      - name: registration_year
        data_type: integer
      - name: expected_start_date
        data_type: date
      - name: expected_end_date
        data_type: date
      - name: actual_start_date
        data_type: date
      - name: actual_end_date
        data_type: date
      - name: structural_project_indicator
        data_type: text
      - name: postal_code
        data_type: text
      - name: address_description
        data_type: text
      - name: social_function_description
        data_type: text
      - name: global_goal_description
        data_type: text
      - name: benefited_population
        data_type: integer
      - name: benefited_population_description
        data_type: text
      - name: jobs_created_count
        data_type: integer
      - name: bim_indicator
        data_type: integer
      - name: intervention_notes
        data_type: text
      - name: source_system
        data_type: text
      - name: feasibility_study_indicator
        data_type: text
      - name: source_updated_at
        data_type: timestamp with time zone
      - name: ingested_at
        data_type: timestamp with time zone

  - name: dim_organization
    description: Organizações responsáveis observadas no recorte Gold.
    columns:
      - name: organization_key
        data_type: text
        tests: [not_null, unique]
      - name: organization_name
        data_type: text
      - name: organization_cnpj
        data_type: text

  - name: dim_intervention
    description: Dimensão das classificações originais de intervenção.
    columns:
      - name: intervention_key
        data_type: text
        tests: [not_null, unique]
      - name: nature_intervention_id
        data_type: integer
      - name: nature_intervention
        data_type: text
      - name: species_intervention_id
        data_type: integer
      - name: species_intervention
        data_type: text

  - name: fct_planned_investment
    description: Investimento previsto agregado na granularidade projeto, fonte de recurso e ingestão.
    columns:
      - name: project_funding_source_key
        data_type: text
        tests: [not_null, unique]
      - name: project_snapshot_key
        data_type: text
        tests:
          - not_null
          - relationships:
              to: ref('fct_project_snapshot')
              field: project_snapshot_key
      - name: ingestion_id
        data_type: uuid
        tests: [not_null]
      - name: project_id
        data_type: text
        tests: [not_null]
      - name: funding_source_key
        data_type: text
        tests:
          - not_null
          - relationships:
              to: ref('dim_funding_source')
              field: funding_source_key
      - name: funding_source_name
        data_type: text
      - name: planned_investment_amount
        data_type: numeric
      - name: source_investment_record_count
        data_type: bigint
        tests: [not_null]
      - name: source_updated_at
        data_type: timestamp with time zone
      - name: ingested_at
        data_type: timestamp with time zone

  - name: dim_funding_source
    description: Fontes de recurso observadas nos investimentos previstos do recorte Gold.
    columns:
      - name: funding_source_key
        data_type: text
        tests: [not_null, unique]
      - name: funding_source_name
        data_type: text

  - name: dim_axis_type
    description: Combinações de eixo, tipo e subtipo informadas pela fonte.
    columns:
      - name: axis_type_key
        data_type: text
        tests: [not_null, unique]
      - name: axis_id
        data_type: integer
      - name: axis_name
        data_type: text
      - name: type_id
        data_type: integer
      - name: type_name
        data_type: text
      - name: subtype_id
        data_type: integer
      - name: subtype_name
        data_type: text

  - name: bridge_project_axis_type
    description: Relação multivalorada entre projeto e classificação eixo-tipo-subtipo.
    columns:
      - name: project_axis_type_bridge_key
        data_type: text
        tests: [not_null, unique]
      - name: project_snapshot_key
        data_type: text
        tests:
          - not_null
          - relationships:
              to: ref('fct_project_snapshot')
              field: project_snapshot_key
      - name: ingestion_id
        data_type: uuid
        tests: [not_null]
      - name: axis_type_key
        data_type: text
        tests:
          - not_null
          - relationships:
              to: ref('dim_axis_type')
              field: axis_type_key

  - name: dim_location
    description: Geometrias normalizadas em localização municipal por ingestão.
    columns:
      - name: location_key
        data_type: text
        tests: [not_null, unique]
      - name: ingestion_id
        data_type: uuid
        tests: [not_null]
      - name: geometry_id
        data_type: integer
      - name: municipality_name
        data_type: text
      - name: ibge_code
        data_type: bigint
      - name: uf
        data_type: text
      - name: geometry_origin
        data_type: text

  - name: bridge_project_location
    description: Relação entre projetos e geometrias, sem agregação financeira.
    columns:
      - name: project_location_key
        data_type: text
        tests: [not_null, unique]
      - name: project_snapshot_key
        data_type: text
        tests:
          - not_null
          - relationships:
              to: ref('fct_project_snapshot')
              field: project_snapshot_key
      - name: ingestion_id
        data_type: uuid
        tests: [not_null]
      - name: project_id
        data_type: text
        tests: [not_null]
      - name: location_key
        data_type: text
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_key

  - name: dim_pin
    description: Coordenadas de pins recebidas pela fonte, preservadas separadamente das geometrias municipais.
    columns:
      - name: pin_key
        data_type: text
        tests: [not_null, unique]
      - name: ingestion_id
        data_type: uuid
        tests: [not_null]
      - name: pin_name
        data_type: text
      - name: latitude
        data_type: numeric
      - name: longitude
        data_type: numeric

  - name: bridge_project_pin
    description: Relação multivalorada entre projeto e pin.
    columns:
      - name: project_pin_key
        data_type: text
        tests: [not_null, unique]
      - name: project_snapshot_key
        data_type: text
        tests:
          - not_null
          - relationships:
              to: ref('fct_project_snapshot')
              field: project_snapshot_key
      - name: ingestion_id
        data_type: uuid
        tests: [not_null]
      - name: pin_key
        data_type: text
        tests:
          - not_null
          - relationships:
              to: ref('dim_pin')
              field: pin_key

  - name: vw_market_overview_current
    description: Interface Gold atual para visão de mercado; uma linha por projeto da última ingestão bem-sucedida.
    columns:
      - name: project_id
        description: Identificador do projeto de investimento.
        data_type: text
        tests: [not_null, unique]
      - name: project_name
        description: Nome informado pela fonte.
        data_type: text
      - name: description
        description: Descrição detalhada do projeto informada pela fonte.
        data_type: text
      - name: organization_name
        description: Organização responsável.
        data_type: text
      - name: organization_cnpj
        description: CNPJ da organização responsável.
        data_type: text
      - name: source_status
        description: Situação original do projeto, sem reclassificação.
        data_type: text
      - name: uf_principal
        description: UF principal original do projeto.
        data_type: text
        tests:
          - accepted_values:
              values: [CE]
      - name: nature_intervention
        description: Natureza original da intervenção.
        data_type: text
        tests:
          - accepted_values:
              values: [Obra]
      - name: species_intervention
        description: Espécie original da intervenção.
        data_type: text
        tests:
          - accepted_values:
              values: ['Construção']
      - name: axis_name
        description: Eixos agregados por projeto sem multiplicar linhas.
        data_type: text
      - name: type_name
        description: Tipos agregados por projeto sem multiplicar linhas.
        data_type: text
      - name: subtype_name
        description: Subtipos agregados por projeto sem multiplicar linhas.
        data_type: text
      - name: registration_date
        description: Data de cadastro informada pela fonte.
        data_type: date
      - name: registration_year
        description: Ano de cadastro informado pela fonte.
        data_type: integer
      - name: expected_start_date
        description: Data inicial prevista informada pela fonte.
        data_type: date
      - name: expected_end_date
        description: Data final prevista informada pela fonte.
        data_type: date
      - name: planned_investment_amount
        description: Soma do investimento previsto por projeto, sem misturar métricas financeiras.
        data_type: numeric
      - name: municipality_names
        description: Municípios agregados por projeto.
        data_type: text
      - name: ibge_codes
        description: Códigos IBGE agregados por projeto.
        data_type: text
      - name: source_updated_at
        description: Momento de atualização informado pela API.
        data_type: timestamp with time zone
        tests: [not_null]
      - name: ingested_at
        description: Momento de término da ingestão publicada.
        data_type: timestamp with time zone
        tests: [not_null]
      - name: ingestion_id
        description: Identificador da última ingestão bem-sucedida.
        data_type: uuid
        tests: [not_null]

  - name: vw_project_investment_current
    description: Interface Gold atual de investimento previsto, uma linha por projeto e fonte de recurso.
    columns:
      - name: project_id
        description: Identificador do projeto de investimento.
        data_type: text
        tests: [not_null]
      - name: funding_source_name
        description: Fonte de recurso como fornecida pela API.
        data_type: text
      - name: planned_investment_amount
        description: Investimento previsto da fonte, sem mistura de outras métricas financeiras.
        data_type: numeric
      - name: source_updated_at
        description: Momento de atualização informado pela API.
        data_type: timestamp with time zone
        tests: [not_null]
      - name: ingested_at
        description: Momento de término da ingestão publicada.
        data_type: timestamp with time zone
        tests: [not_null]
      - name: ingestion_id
        description: Identificador da última ingestão bem-sucedida.
        data_type: uuid
        tests: [not_null]

  - name: vw_project_location_current
    description: Interface Gold atual de localização, com uma linha por associação territorial de geometria ou pin de coordenada; município e coordenadas ocupam linhas próprias.
    columns:
      - name: project_id
        description: Identificador do projeto de investimento.
        data_type: text
        tests: [not_null]
      - name: municipality_name
        description: Município da geometria normalizada.
        data_type: text
      - name: geometry_id
        description: Identificador da associação geométrica recebida pela fonte.
        data_type: integer
      - name: ibge_code
        description: Código IBGE do município.
        data_type: bigint
      - name: uf
        description: UF da geometria.
        data_type: text
      - name: geometry_origin
        description: Origem da geometria informada pela fonte.
        data_type: text
      - name: pin_name
        description: Rótulo original do pin quando a fonte o informa.
        data_type: text
      - name: latitude
        description: Latitude do pin quando informada e válida pela fonte.
        data_type: numeric
      - name: longitude
        description: Longitude do pin quando informada e válida pela fonte.
        data_type: numeric
      - name: planned_investment_amount
        description: Investimento previsto total do projeto; não deve ser somado entre municípios.
        data_type: numeric
      - name: source_updated_at
        description: Momento de atualização informado pela API.
        data_type: timestamp with time zone
        tests: [not_null]
      - name: ingested_at
        description: Momento de término da ingestão publicada.
        data_type: timestamp with time zone
        tests: [not_null]
      - name: ingestion_id
        description: Identificador da última ingestão bem-sucedida.
        data_type: uuid
        tests: [not_null]

  - name: vw_status_distribution_current
    description: Distribuição da situação original dos projetos na última ingestão bem-sucedida.
    columns:
      - name: source_status
        description: Situação original informada pela API.
        data_type: text
        tests: [unique]
      - name: project_count
        description: Quantidade de projetos na situação original.
        data_type: bigint
        tests: [not_null]

  - name: vw_snapshot_metadata_current
    description: Metadados e contagens do snapshot Gold atual.
    columns:
      - name: ingestion_id
        description: Identificador da última ingestão bem-sucedida.
        data_type: uuid
        tests: [not_null, unique]
      - name: source_updated_at
        description: Momento de atualização informado pela API.
        data_type: timestamp with time zone
        tests: [not_null]
      - name: ingested_at
        description: Momento de término da ingestão publicada.
        data_type: timestamp with time zone
        tests: [not_null]
      - name: project_count
        description: Quantidade de projetos no recorte Gold.
        data_type: bigint
        tests: [not_null]
      - name: planned_investment_count
        description: Quantidade de pares projeto-fonte de recurso.
        data_type: bigint
        tests: [not_null]
      - name: planned_investment_amount
        description: Soma do investimento previsto no snapshot atual; nulo quando a fonte não informa valores.
        data_type: numeric
      - name: location_count
        description: Quantidade de relações projeto-geometria.
        data_type: bigint
        tests: [not_null]
      - name: municipality_count
        description: Quantidade distinta de municípios com código IBGE.
        data_type: bigint
        tests: [not_null]
      - name: execution_project_count
        description: Quantidade de projetos com a situação original Em execução.
        data_type: bigint
        tests: [not_null]

  - name: dim_supplier
    description: Fornecedores observados nos contratos do recorte Gold.
    columns:
      - {name: supplier_key, data_type: text, tests: [not_null, unique]}
      - {name: supplier_name, data_type: text}
      - {name: supplier_cnpj, data_type: text}

  - name: fct_contract
    description: Contratos na granularidade do identificador de contrato e projeto.
    columns:
      - {name: contract_key, data_type: text, tests: [not_null, unique]}
      - {name: project_snapshot_key, data_type: text, tests: [not_null]}
      - {name: ingestion_id, data_type: uuid, tests: [not_null]}
      - {name: project_id, data_type: text, tests: [not_null]}
      - {name: contract_source_id, data_type: text}
      - {name: contract_number, data_type: text}
      - {name: supplier_key, data_type: text}
      - {name: supplier_name, data_type: text}
      - {name: supplier_cnpj, data_type: text}
      - {name: contract_status, data_type: text}
      - {name: validity_start_date, data_type: date}
      - {name: validity_end_date, data_type: date}
      - {name: contract_object, data_type: text}
      - {name: process_number, data_type: text}
      - {name: modality, data_type: text}
      - {name: organization_name, data_type: text}
      - {name: category, data_type: text}
      - {name: procurement_number, data_type: text}
      - {name: transparency_link, data_type: text}
      - {name: valor_global_contrato, data_type: numeric}
      - {name: valor_acumulado_contrato, data_type: numeric}
      - {name: valor_utilizado_pi_contrato, data_type: numeric}
      - {name: valor_incluido_contrato, data_type: numeric}
      - {name: source_updated_at, data_type: timestamp with time zone}
      - {name: ingested_at, data_type: timestamp with time zone}

  - name: fct_commitment
    description: Empenhos na granularidade da chave deduplicada da fonte.
    columns:
      - {name: commitment_key, data_type: text, tests: [not_null, unique]}
      - {name: project_snapshot_key, data_type: text, tests: [not_null]}
      - {name: ingestion_id, data_type: uuid, tests: [not_null]}
      - {name: project_id, data_type: text, tests: [not_null]}
      - {name: commitment_number, data_type: text}
      - {name: emission_date, data_type: date}
      - {name: issuing_ug, data_type: text}
      - {name: source_system, data_type: text}
      - {name: source_base, data_type: text}
      - {name: expense_nature, data_type: text}
      - {name: creditor_name, data_type: text}
      - {name: commitment_description, data_type: text}
      - {name: valor_empenho, data_type: numeric}
      - {name: aliquidar, data_type: numeric}
      - {name: liquidado, data_type: numeric}
      - {name: pago, data_type: numeric}
      - {name: rpinscrito, data_type: numeric}
      - {name: rpaliquidar, data_type: numeric}
      - {name: rpaliquidado, data_type: numeric}
      - {name: rppago, data_type: numeric}
      - {name: source_updated_at, data_type: timestamp with time zone}
      - {name: ingested_at, data_type: timestamp with time zone}

  - name: fct_physical_execution
    description: Execução física na granularidade de cada id recebido pela API.
    columns:
      - {name: physical_execution_key, data_type: text, tests: [not_null, unique]}
      - {name: project_snapshot_key, data_type: text, tests: [not_null]}
      - {name: ingestion_id, data_type: uuid, tests: [not_null]}
      - {name: project_id, data_type: text, tests: [not_null]}
      - {name: id_execucao_fisica, data_type: text}
      - {name: instrument, data_type: text}
      - {name: physical_execution_percentage, data_type: numeric}
      - {name: execution_registration_at, data_type: timestamp without time zone}
      - {name: execution_start_date, data_type: date}
      - {name: execution_end_date, data_type: date}
      - {name: instrument_creation_date, data_type: date}
      - {name: source_update_date, data_type: date}
      - {name: execution_form, data_type: text}
      - {name: indicators, data_type: jsonb}
      - {name: reasons, data_type: jsonb}
      - {name: source_record_count, data_type: bigint, tests: [not_null]}
      - {name: source_updated_at, data_type: timestamp with time zone}
      - {name: ingested_at, data_type: timestamp with time zone}

  - name: fct_status_event
    description: Eventos de cancelamento ou paralisação recebidos pela API.
    columns:
      - {name: status_event_key, data_type: text, tests: [not_null, unique]}
      - {name: project_snapshot_key, data_type: text, tests: [not_null]}
      - {name: ingestion_id, data_type: uuid, tests: [not_null]}
      - {name: project_id, data_type: text, tests: [not_null]}
      - {name: status_event_source_id, data_type: text}
      - {name: event_date, data_type: date}
      - {name: source_status, data_type: text}
      - {name: justification, data_type: text}
      - {name: treatment_indicator, data_type: text}
      - {name: treatment_phase, data_type: text}
      - {name: source_updated_at, data_type: timestamp with time zone}
      - {name: ingested_at, data_type: timestamp with time zone}

  - name: fct_feasibility_study
    description: Estudos de viabilidade na granularidade informada pela fonte.
    columns:
      - {name: study_key, data_type: text, tests: [not_null, unique]}
      - {name: project_snapshot_key, data_type: text, tests: [not_null]}
      - {name: ingestion_id, data_type: uuid, tests: [not_null]}
      - {name: project_id, data_type: text, tests: [not_null]}
      - {name: study_type, data_type: text}
      - {name: study_specification, data_type: text}
      - {name: source_updated_at, data_type: timestamp with time zone}
      - {name: ingested_at, data_type: timestamp with time zone}

  - name: bridge_project_participant
    description: Relação entre projeto e participante com papel preservado.
    columns:
      - {name: project_participant_key, data_type: text, tests: [not_null, unique]}
      - {name: project_snapshot_key, data_type: text, tests: [not_null]}
      - {name: ingestion_id, data_type: uuid, tests: [not_null]}
      - {name: project_id, data_type: text, tests: [not_null]}
      - {name: participant_role, data_type: text}
      - {name: organization_key, data_type: text}
      - {name: organization_name, data_type: text}
      - {name: organization_cnpj, data_type: text}
      - {name: source_participant_count, data_type: bigint}

  - name: bridge_project_photo_indicator
    description: Indicadores de foto recebidos pela fonte.
    columns:
      - {name: project_photo_indicator_key, data_type: text, tests: [not_null, unique]}
      - {name: project_snapshot_key, data_type: text, tests: [not_null]}
      - {name: ingestion_id, data_type: uuid, tests: [not_null]}
      - {name: project_id, data_type: text, tests: [not_null]}
      - {name: ind_foto, data_type: text}

  - name: bridge_project_ppa
    description: Relação entre projeto e PPA sem inventar conteúdo.
    columns:
      - {name: project_ppa_key, data_type: text, tests: [not_null, unique]}
      - {name: project_snapshot_key, data_type: text, tests: [not_null]}
      - {name: ingestion_id, data_type: uuid, tests: [not_null]}
      - {name: project_id, data_type: text, tests: [not_null]}
      - {name: ppa_key, data_type: text}

  - name: bridge_project_restriction_area
    description: Relação entre projeto e área de restrição como texto de origem.
    columns:
      - {name: project_restriction_area_key, data_type: text, tests: [not_null, unique]}
      - {name: project_snapshot_key, data_type: text, tests: [not_null]}
      - {name: ingestion_id, data_type: uuid, tests: [not_null]}
      - {name: project_id, data_type: text, tests: [not_null]}
      - {name: restriction_area_key, data_type: text}

  - name: dim_ppa
    description: Valores distintos de PPA informados pela fonte.
    columns:
      - {name: ppa_key, data_type: text}
      - {name: ppa_type, data_type: text}
      - {name: ppa_description, data_type: text}

  - name: dim_restriction_area
    description: Áreas de restrição textuais informadas pela fonte.
    columns:
      - {name: restriction_area_key, data_type: text}
      - {name: restriction_area, data_type: text}

  - name: vw_project_detail_current
    description: Cabeçalho detalhado do projeto no snapshot atual.
    columns:
      - {name: project_id, data_type: text}
      - {name: project_name, data_type: text}
